name: auction-reels

services:
  auction-reel-server:
    build:
      context: .
      dockerfile: Dockerfile
    image: auction-reel-server:latest
    container_name: auction-reel-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=development
      - PORT=8080
      - STREAM_CONCURRENCY=1
      - LOT_CONCURRENCY=2
      - RENDER_THREADS=4
    env_file:
      - .env
    volumes:
      - auction-reels-scratch:/tmp/auction-reels-scratch
      - reel-themes:/tmp/reel-themes
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 5s

volumes:
  auction-reels-scratch:
  reel-themes:
